# WFP 数据源配置（v0.4.20 架构重构）
# 原则：WFP 是纯测量端，只依赖"语料数据源"与"评分协议"，不硬编码其他模块路径。
# 修改此处后重跑基线即可生效；CLI 参数（--spi-path / --aot-dir）可覆盖。
# 路径支持 ${VAR} 环境变量（scripts/data_sources.py 解析）：SPI_ROOT / AOT_ROOT / WFP_ROOT / WFP_OBJ（对象 key）。
# 未设置的变量会报错退出，不会带着字面路径继续跑。

corpus:
  spi_articles: ${SPI_ROOT}/data/results/${WFP_OBJ}_profiles/${WFP_OBJ}_articles_clean.json
  aot_dir: ${AOT_ROOT}/data/corpus_full/

llm:
  # L3 软评分协议复用 AoT 已验证协议（仅协议对齐，不 import AoT 代码）
  # key 加载见 scripts/llm_common.py（env DEEPSEEK_API_KEY 优先，其次各仓库 .env）
  # 模型 / temperature / 重试 / 并发 等参数统一在 config/llm.yaml

# L4 隐喻根域词元：根域名冻结自 AoT尺子_v1.0 维度6（12 根域），词元为 WFP 内嵌工程口径
# （见 docs/WFP学术基础研究.md 第 8 章），不随 AoT 变更。
metaphor:
  source_note: "AoT尺子_v1.0 维度6 12 根域（冻结），词元内嵌于 extract_hard_metrics.py"

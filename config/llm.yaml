# WFP L3 软评分协议（占位，v0.3 实现）
# 复用 AoT 协议（<AoT_ROOT>/scripts/score_thinking.py）：
#   双轮 temperature 0.3/0.7 取均值；证据句逐字引用原文 ≤3 条；confidence 0-1。

provider: deepseek        # 与 AoT 对齐，待定
rounds: [0.3, 0.7]        # 双轮 temperature
evidence_max: 3           # 证据句条数上限
confidence: true          # 输出 0-1 置信度
scale: 1-7                # 与 AoT 尺子同刻度
thresholds:
  low: [1.0, 2.49]
  mid: [2.5, 4.49]
  high: [4.5, 7.0]

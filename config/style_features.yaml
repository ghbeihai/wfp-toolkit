# WFP 特征词典 v0.4（单一配置源）
# 层级：L1 语言表层 / L2 语篇结构 / L3 叙事修辞（软评分）/ L4 文本表层投影
# status: frozen=口径已冻结（v0.1-v0.4 脚本已实现部分） planned=待实现
# 学术原则：basis 只填概念来源（经典或已核验文献）；完整谱系与核验状态见 docs/WFP学术基础研究.md
version: 0.4.1
module: WFP

features:
  # ============ L1 词汇层 ============
  - id: L1_LEX_001
    layer: L1_lexical
    name_zh: 词汇多样性-字符级
    name_en: TTR_char
    type: ratio
    definition: 字种数 / 总字数（去空白）；另算滑动窗口 STTR（每 100 字）平滑文本长度干扰
    basis: Holmes 1994; Grieve 2007
    status: frozen

  - id: L1_LEX_002
    layer: L1_lexical
    name_zh: 词汇多样性-词级
    name_en: TTR_word
    type: ratio
    definition: 词种数 / 总词数（jieba 分词；去停用词另出一版）
    basis: Holmes 1994
    status: frozen

  - id: L1_LEX_003
    layer: L1_lexical
    name_zh: 高频词画像
    name_en: TopWords
    type: distribution
    definition: Top-50 词表及占比；对比同批语料均值（个人 vs 基线）
    basis: Mosteller & Wallace 1964（功能词作者识别）; Burrows 2002（Delta）
    status: frozen

  - id: L1_LEX_004
    layer: L1_lexical
    name_zh: 语气词频率
    name_en: ParticleRate
    type: per_k
    definition: 啊/呢/吧/嘛/哦/呀/啦/哈/呗/么 等每千字出现次数
    basis: 方梅 2000（汉语口语话语标记）; 汉语语气词研究
    status: frozen

  - id: L1_LEX_005
    layer: L1_lexical
    name_zh: 话语标记频率
    name_en: DiscourseMarkers
    type: per_k
    definition: 这个/就是说/然后/其实/反正/是不是/对不对/有没有/你看 每千字次数
    basis: Schiffrin 1987 Discourse Markers; 方梅 2000
    status: frozen

  - id: L1_LEX_006
    layer: L1_lexical
    name_zh: 人称代词策略
    name_en: PronounProfile
    type: ratio
    definition: 我/你/他/她/我们/你们/咱们 各自频率及 我：你 比值
    basis: Pennebaker 语言风格与人格; LIWC 人称维度; Park et al. 2015
    status: frozen

  - id: L1_LEX_007
    layer: L1_lexical
    name_zh: 情感词密度
    name_en: SentimentDensity
    type: ratio
    definition: 积极/消极情感词占比（HowNet/LIWC 词典）及正负比
    basis: LIWC（Pennebaker et al. 2015）; 知网 HowNet 情感词典
    status: frozen

  - id: L1_LEX_008
    layer: L1_lexical
    name_zh: 认知词频率
    name_en: CognitiveWords
    type: per_k
    definition: 觉得/认为/可能/应该/相信/明白 等认知动词每千字次数
    basis: LIWC 认知过程维度; LIWC-22（Boyd et al. 2022）
    status: frozen

  # ============ L1 句法层 ============
  - id: L1_SYN_001
    layer: L1_syntactic
    name_zh: 平均句长
    name_en: MeanSentenceLength
    type: numeric
    definition: 字符数 / 句数（按 。！？… 切分）
    basis: Yule 1939; Morton 1978
    status: frozen

  - id: L1_SYN_002
    layer: L1_syntactic
    name_zh: 句长分布
    name_en: SentenceLenDist
    type: distribution
    definition: 标准差、偏度、四分位；短句（<10 字）占比、长句（>40 字）占比
    basis: Grieve 2007
    status: frozen

  - id: L1_SYN_003
    layer: L1_syntactic
    name_zh: 标点使用频率
    name_en: PunctuationProfile
    type: per_k
    definition: 逗号/句号/叹号/问号/顿号/分号/破折号/省略号/引号 每千字次数
    basis: Baayen, van Halteren & Tweedie 1996
    status: frozen

  - id: L1_SYN_004
    layer: L1_syntactic
    name_zh: 设问/反问句
    name_en: QuestionSentences
    type: count
    definition: 问句数（？结尾 + 无问号疑问结构句：是不是/对不对/有没有 等疑问标记、≤20 字短句以 吗/么/呢 结尾）；反问标记句数（难道/岂/怎么 等）
    basis: 陈望道《修辞学发凡》1932（设问/反问格）
    status: frozen

  - id: L1_SYN_005
    layer: L1_syntactic
    name_zh: 固定句式
    name_en: FixedPatterns
    type: per_k
    definition: 把字句/被字句/让字句/「是…的」判断句 频率
    basis: 朱德熙《语法讲义》1982（把字句/被字句/判断句）
    status: frozen

  - id: L1_SYN_006
    layer: L1_syntactic
    name_zh: 四字格/成语密度
    name_en: IdiomDensity
    type: per_k
    definition: 成语词典匹配每千字次数
    basis: 刘叔新《汉语描写词汇学》1990（熟语与固定语）
    status: frozen

  - id: L1_SYN_007
    layer: L1_syntactic
    name_zh: 句长变异系数（burstiness）
    name_en: SentenceLengthBurstiness
    type: numeric
    definition: 句长标准差 / 平均句长（CV）；人类文本通常 >0.5，机器生成文本 <0.3（节奏死板）
    basis: Grieve 2007（句长分布实证）；句长变异系数在人类/机器文本判别中的实证用法（Eder et al. 2016 stylo）
    status: frozen

  # ============ L2 语篇层 ============
  - id: L2_DIS_001
    layer: L2_discourse
    name_zh: 段落结构
    name_en: ParagraphProfile
    type: distribution
    definition: 段落数、平均段长、段长变异系数
    basis: Brown & Yule 1983（语篇单位）; Halliday 1994（信息结构）
    status: frozen

  - id: L2_DIS_002
    layer: L2_discourse
    name_zh: 衔接词密度
    name_en: ConnectiveDensity
    type: per_k
    definition: 转折（但是/然而/不过）因果（所以/因此/因为）递进（而且/并且）时序（然后/接着/最后）每千字次数
    basis: Halliday & Hasan 1976（衔接理论）
    status: frozen

  - id: L2_DIS_003
    layer: L2_discourse
    name_zh: 指代回指密度
    name_en: AnaphoraDensity
    type: per_k
    definition: 代词回指/名词回指比例（需标注，半自动）
    basis: Halliday & Hasan 1976; Ariel 1990（可及性理论）
    status: frozen

  - id: L2_DIS_004
    layer: L2_discourse
    name_zh: 主位推进模式
    name_en: ThematicProgression
    type: soft
    definition: 平行/延续/派生主位模式分布（需标注）
    basis: Daneš 1974
    status: frozen

  - id: L2_DIS_005
    layer: L2_discourse
    name_zh: 开头/结尾功能
    name_en: OpenCloseFunction
    type: soft
    definition: 首段 hook 类型（设问/断言/故事/场景/引用/数据）；末段功能（总结/呼吁/反问/金句）
    basis: Swales 1990（CARS 语步模型）
    status: frozen

  - id: L2_DIS_006
    layer: L2_discourse
    name_zh: 信息顺序
    name_en: InfoOrder
    type: soft
    definition: 先结论后论证 vs 先铺垫后结论（规则近似或 LLM 判定）
    basis: Mann & Thompson 1988（修辞结构理论，核心-卫星）
    status: frozen

  # ============ L3 叙事层（软评分，v0.3 尺子） ============
  - id: L3_NAR_001
    layer: L3_narrative
    name_zh: 叙述者与视角
    name_en: NarratorFocalization
    type: soft_score
    definition: 叙述者身份与聚焦类型（零/内/外）；叙述声音的介入程度与可靠性
    basis: Genette 1972/1980; Booth 1961
    status: frozen

  - id: L3_NAR_002
    layer: L3_narrative
    name_zh: 叙述距离
    name_en: NarrativeDistance
    type: soft_score
    definition: 叙述者与读者/人物的距离远近；自由间接引语造成的内心化程度
    basis: Genette; Cohn 1978; Fludernik 1993
    status: frozen

  - id: L3_NAR_003
    layer: L3_narrative
    name_zh: 时间结构
    name_en: NarrativeTime
    type: soft_score
    definition: 时序（顺/倒/插叙）、时距（场景/概要/停顿）、节奏详略
    basis: Genette 叙事时间（order/duration/frequency）
    status: frozen

  - id: L3_NAR_004
    layer: L3_narrative
    name_zh: 引语呈现方式
    name_en: SpeechPresentation
    type: soft_score
    definition: 直接引语/间接引语/自由间接引语 的分布偏好
    basis: Leech & Short 2007（话语呈现五级标尺）
    status: frozen

  # ============ L3 修辞层（软评分，v0.3 尺子） ============
  - id: L3_RHT_001
    layer: L3_rhetoric
    name_zh: 说服三诉求
    name_en: EthosPathosLogos
    type: soft_score
    definition: ethos（可信度）/ pathos（情感）/ logos（逻辑）三诉求的相对强度与主导模式
    basis: 亚里士多德《修辞学》
    status: frozen

  - id: L3_RHT_002
    layer: L3_rhetoric
    name_zh: 论证结构与论据类型
    name_en: ArgumentationEvidence
    type: soft_score
    definition: 论据来源（数据/权威/经验/故事/常识）与论证方式（归纳/演绎/类比）
    basis: Walton 2008 论证图式; Toulmin 1958
    status: frozen

  - id: L3_RHT_003
    layer: L3_rhetoric
    name_zh: 修辞格类型分布
    name_en: RhetoricalFigures
    type: per_k
    definition: 比喻/拟人/排比/反问/设问/夸张/对偶/反复 等分布（规则+LLM 混合）
    basis: Leech & Short 2007; 陈望道《修辞学发凡》1932
    status: frozen

  - id: L3_RHT_004
    layer: L3_rhetoric
    name_zh: 说理模式
    name_en: ReasoningMode
    type: soft_score
    definition: 从具体人事生发道理（案例先行） vs 抽象说理/结论先行；例证驱动 vs 演绎驱动
    basis: Green & Brock 2000（叙事传输理论）; 叙事修辞研究
    status: frozen

  - id: L3_RHT_005
    layer: L3_rhetoric
    name_zh: 情绪唤起路径
    name_en: EmotionalAppealPath
    type: soft_score
    definition: 主要唤起情绪（恐惧/希望/温暖/愤怒/共情）及强度策略
    basis: Witte 1992（扩展平行过程模型 EPPM）
    status: frozen

  # ============ L3 姿态层（软评分，v0.3 尺子） ============
  - id: L3_STA_001
    layer: L3_stance
    name_zh: 评价态度
    name_en: Appraisal
    type: soft_score
    definition: 评价理论三系统（情感/判断/鉴赏）的分布与极性
    basis: Martin & White 2005 Appraisal framework
    status: frozen

  - id: L3_STA_002
    layer: L3_stance
    name_zh: 情态系统
    name_en: Modality
    type: soft_score
    definition: 认知情态（确定/犹疑）与道义情态（应该/必须）的强度与笃定度
    basis: Halliday 系统功能语言学情态; Palmer 2001
    status: frozen

  - id: L3_STA_003
    layer: L3_stance
    name_zh: 读者互动与元话语
    name_en: EngagementMetadiscourse
    type: soft_score
    definition: 直接称呼读者、互动问句、命令/建议、互动元话语标记（你看/你想想/我们来看）密度
    basis: Hyland 2005 Metadiscourse; 互动语言学
    status: frozen

  - id: L3_STA_004
    layer: L3_stance
    name_zh: 姿态基调
    name_en: StanceTone
    type: soft_score
    definition: 四对极轴取值：权威/平等、自信/谦逊、幽默/严肃、煽情/克制
    basis: Biber & Finegan 1989（立场风格）; Du Bois 2007（立场三角）
    status: frozen

  - id: L3_STA_005
    layer: L3_stance
    name_zh: 语域正式度
    name_en: RegisterFormality
    type: soft_score
    definition: 书面-口语、正式-亲民连续统；口语词/主持腔/播音腔识别
    basis: Biber & Conrad 2009（Register, Genre, and Style）; Biber 1988
    status: frozen

  # ============ L4 文本表层投影（只测不释） ============
  - id: L4_SUR_001
    layer: L4_surface
    name_zh: 隐喻密度与根域分布
    name_en: MetaphorDensity
    type: per_k
    definition: 隐喻密度及 12 根域分布（旅程/战争/建筑/机器/生命/市场/游戏/剧场/容器/光暗/上下/温度），复用 AoT 尺子维度6 锚点词元
    basis: Lakoff & Johnson 1980; AoT尺子_v1.0 维度6
    status: frozen

  - id: L4_SUR_002
    layer: L4_surface
    name_zh: 价值词极性
    name_en: ValueLexicon
    type: ratio
    definition: 价值判断词（应该/必须/值得/重要）频率与极性
    basis: 评价理论; LIWC
    status: frozen

  - id: L4_SUR_003
    layer: L4_surface
    name_zh: 情绪词密度与极性
    name_en: EmotionDensity
    type: ratio
    definition: 情绪词占比与正负极性（特征值；不解释构念，构念分归 SPI）
    basis: LIWC; SPI 情感类因子
    status: frozen
